<!doctype html><html lang="en"><meta charset="utf-8"><title>Skincare responsive review</title><style>body{font:14px Arial;background:#edf1f3;margin:16px;color:#24343b}nav{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}a{color:inherit;padding:7px 9px;background:white;border-radius:3px}main{display:flex;gap:20px}iframe{border:1px solid #b8c6ce;height:800px;background:white;flex:none}h1{font-size:18px}</style><h1>Skincare responsive review</h1><nav id="products"></nav><nav id="sections"></nav><main><iframe title="Phone product page" width="375"></iframe><iframe title="Tablet product page" width="900"></iframe></main><script>
const ids=['copper-peptide-restore-cream','retinol-rx','hydra-c-ferulic-serum','exfoliating-pads','hydrating-tonic','firming-peptide-eye-gel','anti-aging-cleanser-with-peptides'];const parts=['product-benefits','product-formula','product-routine','compare'];const params=new URLSearchParams(location.search);const id=ids.includes(params.get('product'))?params.get('product'):ids[0];const section=parts.includes(params.get('section'))?params.get('section'):parts[0];for(const product of ids){const a=document.createElement('a');a.href=`?product=${product}&section=${section}`;a.textContent=product;document.querySelector('#products').append(a)}for(const part of parts){const a=document.createElement('a');a.href=`?product=${id}&section=${part}`;a.textContent=part;document.querySelector('#sections').append(a)}document.querySelectorAll('iframe').forEach(frame=>frame.src=`/products/${id}?review=range-v9#${section}`);
</script></html>
